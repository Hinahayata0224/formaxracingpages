name: Sync race days

on:
  schedule:
    # 每天 09:00（北京时间）跑一次；比赛周可以临时改成每小时
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      expect:
        description: '预期比赛日数（合集里缺的天会写成「敬请期待」），留空则按合集实际天数'
        required: false
        default: ''
      force:
        description: '强制重新下载并转换全部封面（用于验证 webp 流程）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Sync from WeChat album
        run: |
          ARGS="--require-webp"
          if [ -n "${{ inputs.expect }}" ]; then ARGS="$ARGS --expect ${{ inputs.expect }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force-images"; fi
          echo "node tools/sync-race.mjs $ARGS"
          node tools/sync-race.mjs $ARGS

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race-days.json image/race
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(race): sync 赛场动态 from WeChat album"
          git push
