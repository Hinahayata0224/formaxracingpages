name: Sync race days

on:
  schedule:
    # 每天 09:00（北京时间）跑一次；比赛周可以临时改成每小时
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      expect:
        description: '预期比赛日数（合集里缺的天会写成「敬请期待」），留空则按合集实际天数'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync from WeChat album
        run: |
          if [ -n "${{ inputs.expect }}" ]; then
            node tools/sync-race.mjs --expect "${{ inputs.expect }}"
          else
            node tools/sync-race.mjs
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race-days.json image/race
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(race): sync 赛场动态 from WeChat album"
          git push
