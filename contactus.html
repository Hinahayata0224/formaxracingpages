<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name='description' content='华南理工大学Formax方程式赛车队官方网站-加入我们页面'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - Formax方程式赛车队</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #e10600;
            --secondary-color: #000;
            --accent-color: #fff;
            --text-color: #333;
            --light-gray: #f5f5f5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            color: var(--text-color);
            line-height: 1.6;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--accent-color);
            padding: 0.8rem 1.8rem;
            border-radius: 30px;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background-color: var(--accent-color);
            color: var(--primary-color);
            transform: translateY(-3px);
        }
        
        /* 部分通用样式 */
        section {
            padding: 5rem 0;
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .section-title h2 {
            font-size: 2.5rem;
            color: var(--secondary-color);
            position: relative;
            display: inline-block;
            padding-bottom: 0.5rem;
        }
        
        .section-title h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background-color: var(--primary-color);
        }
        
        /* 联系内容样式 */
        .contact-content {
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
        }
        
        .contact-info {
            flex: 1;
            min-width: 300px;
        }
        
        .contact-form {
            flex: 1;
            min-width: 300px;
        }
        
        .info-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 2rem;
        }
        
        .info-item i {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-right: 1rem;
            min-width: 30px;
            text-align: center;
            margin-top: 0.3rem;
        }
        
        .info-content h3 {
            margin-bottom: 0.5rem;
            color: var(--secondary-color);
        }
        
        /* 表单样式 */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        
        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        
        select.form-control {
            padding: 0.8rem;
            background-color: white;
        }
        
        /* 文件上传样式 */
        input[type="file"] {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            width: 100%;
        }
        
        input[type="file"]::file-selector-button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            margin-right: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        input[type="file"]::file-selector-button:hover {
            background-color: #c10000;
        }
        
        small {
            display: block;
            margin-top: 0.5rem;
            color: #666;
            font-size: 0.8rem;
        }
        
        /* 消息提示样式 */
        #form-message {
            display: none;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 5px;
            text-align: center;
        }
        
        /* 地图样式 */
        .map-container {
            margin-top: 2rem;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .map-container iframe {
            width: 100%;
            height: 300px;
            border: none;
        }
        
        /* 页脚样式 */
        footer {
            background-color: var(--secondary-color);
            color: var(--accent-color);
            padding: 3rem 0;
            text-align: center;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        
        .social-links a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            margin: 0 0.5rem;
            transition: background-color 0.3s;
        }
        
        .social-links a:hover {
            background-color: var(--primary-color);
        }
        
        .social-links i {
            font-size: 1.2rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background-color: var(--secondary-color);
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transition: left 0.3s;
            }
            
            .nav-links.active {
                left: 0;
            }
            
            .nav-links li {
                margin: 1.5rem 0;
            }
            
            .hamburger {
                display: block;
            }
            
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .section-title h2 {
                font-size: 2rem;
            }
            
            .contact-content {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- 联系内容 -->
    <section class="contact">
        <div class="container">
            <div class="section-title">
                <h2>准备好与我们深入交流了吗</h2>
            </div>
            
            <div id="form-message"></div>
            
            <div class="contact-content">
                <div class="contact-info">
                    
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div class="info-content">
                            <h3>地址</h3>
                            <p>广东省广州市天河区华南理工大学（五山校区）汽车科技大楼1楼</p>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <div class="info-content">
                            <h3>邮箱</h3>
                            <p>formax@scutracing.com</p>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <i class="fas fa-phone"></i>
                        <div class="info-content">
                            <h3>电话</h3>
                            <p>+86 195 0206 0130</p>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        <div class="info-content">
                            <h3>工作时间</h3>
                            <p>周一至周五: 9:00 - 17:00</p>
                        </div>
                    </div>
                    
                    <div class="map-container">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3640.233026066089!2d120.12345678901234!3d30.123456789012345!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDA3JzI0LjQiTiAxMjDCsDA3JzM2LjAiRQ!5e0!3m2!1szh-CN!2scn!4v1234567890123!5m2!1szh-CN!2scn" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>
                
                <div class="contact-form">
                    <form action="https://formsubmit.co/70730aaaa@gmail.com" method="POST" enctype="multipart/form-data" id="contact-form">
                        <input type="hidden" name="_subject" value="Formax车队 - 新联系表单提交">
                        <input type="hidden" name="_template" value="table">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_next" value="http://scutracing.top/thankyou.html">
                        
                        <div class="form-group">
                            <label for="name">姓名 *</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">邮箱 *</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="company">公司/组织名称</label>
                            <input type="text" id="company" name="company" class="form-control">
                        </div>
                        
                        <div class="form-group">
                            <label for="interest">咨询类型</label>
                            <select id="interest" name="interest" class="form-control">
                                <option value="">请选择</option>
                                <option value="赞助合作">赞助合作</option>
                                <option value="加入团队">加入团队</option>
                                <option value="媒体咨询">媒体咨询</option>
                                <option value="技术支持">技术支持</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="message">您的消息 *</label>
                            <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="attachment">相关文件（可选）</label>
                            <input type="file" id="attachment" name="attachment" class="form-control">
                            <small>支持格式: PDF, DOC, DOCX, JPG, PNG (最大10MB)</small>
                        </div>
                        
                        <button type="submit" class="btn">发送消息</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="social-links">
                <a href="https://weibo.com/u/7822135530" target="_blank"><i class="fab fa-weibo"></i></a>
                <a href="https://mp.weixin.qq.com/s/4kNCS-z1ISjhzN9l_gPppA" target="_blank"><i class="fab fa-weixin"></i></a>
                <a href="https://www.douyin.com/user/MS4wLjABAAAASI_A4qRxl4_qRsqXSEQ-MmYTEQxgWa0QbR-hhTGfYvo" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://space.bilibili.com/398023708?spm_id_from=333.337.search-card.all.click" target="_blank"><i class="fab fa-bilibili"></i></a>
            </div>
            <p>&copy; 2009-2025 Formax方程式赛车队. 保留所有解释权利.</p>
        </div>
    </footer>

    <script>
        // 导航菜单切换
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
        
        // 表单提交处理
        const contactForm = document.getElementById('contact-form');
        if(contactForm) {
            contactForm.addEventListener('submit', function(e) {
                const formMessage = document.getElementById('form-message');
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                
                // 显示加载状态
                submitBtn.textContent = '发送中...';
                submitBtn.disabled = true;
                
                // 隐藏之前的消息
                if(formMessage) {
                    formMessage.style.display = 'none';
                }
                
                // 表单验证
                const fileInput = this.querySelector('input[type="file"]');
                if(fileInput && fileInput.files.length > 0) {
                    const fileSize = fileInput.files[0].size / 1024 / 1024; // MB
                    if(fileSize > 10) {
                        e.preventDefault();
                        if(formMessage) {
                            formMessage.textContent = '文件大小不能超过10MB';
                            formMessage.style.backgroundColor = '#ffebee';
                            formMessage.style.color = '#c62828';
                            formMessage.style.display = 'block';
                        }
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                        return;
                    }
                }
                
                // 在实际应用中，FormSubmit会处理表单提交
                // 这里只是模拟成功消息
                setTimeout(function() {
                    if(formMessage) {
                        formMessage.textContent = '消息已发送，我们会尽快回复您！';
                        formMessage.style.backgroundColor = '#e8f5e9';
                        formMessage.style.color = '#2e7d32';
                        formMessage.style.display = 'block';
                    }
                    contactForm.reset();
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    
                    // 滚动到消息位置
                    if(formMessage) {
                        formMessage.scrollIntoView({ behavior: 'smooth' });
                    }
                }, 2000);
            });
        }
        
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                
                const targetId = this.getAttribute('href');
                if(targetId === '#') return;
                
                const targetElement = document.querySelector(targetId);
                if(targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 80,
                        behavior: 'smooth'
                    });
                    
                    // 关闭移动端菜单
                    if(navLinks.classList.contains('active')) {
                        navLinks.classList.remove('active');
                    }
                }
            });
        });
    </script>
</body>
</html>
