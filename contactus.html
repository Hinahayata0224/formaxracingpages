<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="description" data-i18n-placeholder="contactusPage.pageDescription" content="华南理工大学Formax方程式赛车队官方网站-加入我们页面">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="contactusPage.pageTitle">联系我们 - Formax方程式赛车队</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== Page-specific Styles: contactus.html ===== */
        .map-container {
            margin-top: 2rem;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .map-container iframe { width: 100%; height: 300px; border: none; }
    </style>
</head>
<body>
    <!-- Contact -->
    <section class="contact">
        <div class="container">
            <div class="section-title"><h2 data-i18n="contactusPage.title">准备好与我们深入交流了吗</h2></div>
            <div id="form-message"></div>
            <div class="contact-content">
                <div class="contact-info-col">
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div class="info-content">
                            <h3 data-i18n="contactusPage.address">地址</h3>
                            <p data-i18n="contactusPage.addressValue">广东省广州市天河区华南理工大学（五山校区）汽车科技大楼1楼</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <div class="info-content">
                            <h3 data-i18n="contactusPage.email">邮箱</h3>
                            <p>formax@scutracing.com</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-phone"></i>
                        <div class="info-content">
                            <h3 data-i18n="contactusPage.phone">电话</h3>
                            <p>+86 195 0206 0130</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        <div class="info-content">
                            <h3 data-i18n="contactusPage.hours">工作时间</h3>
                            <p data-i18n="contactusPage.hoursValue">周一至周五: 9:00 - 17:00</p>
                        </div>
                    </div>
                    <div class="map-container">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3640.233026066089!2d120.12345678901234!3d30.123456789012345!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDA3JzI0LjQiTiAxMjDCsDA3JzM2LjAiRQ!5e0!3m2!1szh-CN!2scn!4v1234567890123!5m2!1szh-CN!2scn" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>
                <div class="contact-form-col">
                    <form action="https://formsubmit.co/70730aaaa@gmail.com" method="POST" enctype="multipart/form-data" id="contact-form">
                        <input type="hidden" name="_subject" value="Formax车队 - 新联系表单提交">
                        <input type="hidden" name="_template" value="table">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_next" value="http://scutracing.top/thankyou.html">
                        <div class="form-group">
                            <label for="name" data-i18n="contactusPage.form.nameRequired">姓名 *</label>
                            <input type="text" id="name" name="name" class="form-control" required data-i18n-placeholder="contactusPage.form.name">
                        </div>
                        <div class="form-group">
                            <label for="email" data-i18n="contactusPage.form.emailRequired">邮箱 *</label>
                            <input type="email" id="email" name="email" class="form-control" required data-i18n-placeholder="contactusPage.form.email">
                        </div>
                        <div class="form-group">
                            <label for="company" data-i18n="contactusPage.form.company">公司/组织名称</label>
                            <input type="text" id="company" name="company" class="form-control" data-i18n-placeholder="contactusPage.form.company">
                        </div>
                        <div class="form-group">
                            <label for="interest" data-i18n="contactusPage.form.interest">咨询类型</label>
                            <select id="interest" name="interest" class="form-control">
                                <option value="" data-i18n="contactusPage.form.interestPlaceholder">请选择</option>
                                <option value="赞助合作" data-i18n="contactusPage.form.interestSponsor">赞助合作</option>
                                <option value="加入团队" data-i18n="contactusPage.form.interestJoin">加入团队</option>
                                <option value="媒体咨询" data-i18n="contactusPage.form.interestMedia">媒体咨询</option>
                                <option value="技术支持" data-i18n="contactusPage.form.interestTech">技术支持</option>
                                <option value="其他" data-i18n="contactusPage.form.interestOther">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="message" data-i18n="contactusPage.form.messageRequired">您的消息 *</label>
                            <textarea id="message" name="message" class="form-control" rows="5" required data-i18n-placeholder="contactusPage.form.message"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="attachment" data-i18n="contactusPage.form.attachment">相关文件（可选）</label>
                            <input type="file" id="attachment" name="attachment" class="form-control">
                            <small class="form-hint" data-i18n="contactusPage.form.fileSupport">支持格式: PDF, DOC, DOCX, JPG, PNG (最大10MB)</small>
                        </div>
                        <button type="submit" class="btn" data-i18n="contactusPage.form.submit">发送消息</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="js/components.js"></script>
    <script src="js/common.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        (function() {
            'use strict';
            Components.injectAll(false);
            I18n.init().then(function() { I18n.translatePage(); });

            var contactForm = document.getElementById('contact-form');
            if (contactForm) {
                contactForm.addEventListener('submit', function(e) {
                    var formMessage = document.getElementById('form-message');
                    var submitBtn = this.querySelector('button[type="submit"]');
                    var originalText = submitBtn.textContent;
                    submitBtn.textContent = I18n.t('common.sending');
                    submitBtn.disabled = true;
                    if (formMessage) formMessage.style.display = 'none';
                    var fileInput = this.querySelector('input[type="file"]');
                    if (fileInput && fileInput.files.length > 0) {
                        var fileSize = fileInput.files[0].size / 1024 / 1024;
                        if (fileSize > 10) {
                            e.preventDefault();
                            if (formMessage) {
                                formMessage.textContent = I18n.t('common.fileTooLarge');
                                formMessage.style.backgroundColor = '#ffebee';
                                formMessage.style.color = '#c62828';
                                formMessage.style.display = 'block';
                            }
                            submitBtn.textContent = originalText;
                            submitBtn.disabled = false;
                            return;
                        }
                    }
                    setTimeout(function() {
                        if (formMessage) {
                            formMessage.textContent = I18n.t('common.sendSuccess');
                            formMessage.style.backgroundColor = '#e8f5e9';
                            formMessage.style.color = '#2e7d32';
                            formMessage.style.display = 'block';
                        }
                        contactForm.reset();
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                        if (formMessage) formMessage.scrollIntoView({ behavior: 'smooth' });
                    }, 2000);
                });
            }
        })();
    </script>
</body>
</html>
