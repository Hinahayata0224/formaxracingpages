<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="thankyouPage.pageTitle">感谢提交 - Formax方程式赛车队</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/effects.css">
    <style>
        /* ===== Page-specific Styles: thankyou.html ===== */
        body { display: flex; flex-direction: column; min-height: 100vh; }
        .hero {
            flex: 1;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('image/misc/hero.jpg') no-repeat center center/cover;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .hero-content { max-width: 800px; padding: 2rem; border-radius: 15px; }
        .hero h1 { font-size: 3.5rem; margin-bottom: 1.5rem; }
        .hero p { font-size: 1.2rem; margin-bottom: 2.5rem; line-height: 1.8; }
        .btn i { margin-right: 0.5rem; }
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .hero p { font-size: 1.1rem; }
        }
        @media (max-width: 480px) {
            .hero h1 { font-size: 2rem; }
            .hero-content { padding: 1.5rem; }
        }
    </style>
</head>
<body data-theme="team">
    <section class="hero">
        <div class="hero-content">
            <h1 data-i18n="thankyouPage.title">感谢您的提交！</h1>
            <p data-i18n="thankyouPage.message">我们已经收到您的信息，将尽快与您联系。感谢您对Formax方程式赛车队的关注与支持，我们期待与您共同书写精彩的赛车故事！</p>
            <a href="/" class="btn"><i class="fas fa-home"></i><span data-i18n="thankyouPage.backHome">返回主页</span></a>
        </div>
    </section>

    <script src="js/effects.js"></script>
    <script src="js/components.js"></script>
    <script src="js/common.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        (function() {
            'use strict';
            Components.injectAll(false);
            I18n.init().then(function() { I18n.translatePage(); });
        })();
    </script>
</body>
</html>
